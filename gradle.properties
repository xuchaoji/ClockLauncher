# 项目级 Gradle 配置（CI 与本地通用）
# 本机 /opt/android-local/gradle-home/gradle.properties 里也有这行，
# 但 CI 环境没有那个全局文件，必须写进仓库，否则 AndroidX 依赖会构建失败。

android.useAndroidX=true

# 说明：不要在这里配置 org.gradle.jvmargs / workers.max，
# 手机 proot 环境依赖全局配置里的内存调优，写死反而容易 OOM。
# 也不要配置 android.aapt2FromMavenOverride，那是 ARM64 本机专用路径，CI 上不存在。
